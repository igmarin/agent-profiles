name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run python scripts/profiles.py validate
      - run: uv run python scripts/profiles.py build
      - run: uv run python scripts/profiles.py check-exports
      - run: uv run python scripts/profiles.py routing
      - run: uv run python -m unittest discover -s tests -v
