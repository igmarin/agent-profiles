name: Pin watcher

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pin-watcher
  cancel-in-progress: false

jobs:
  check-pins:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: agent-profiles
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Clone pinned source packs
        working-directory: agent-profiles
        run: |
          python - <<'PY'
          import json, pathlib, subprocess
          config = json.loads(pathlib.Path("profiles.json").read_text())
          parent = pathlib.Path("..").resolve()
          for short, pack in config["packs"].items():
              dest = parent / pack["repo"]
              if dest.exists():
                  subprocess.run(["git", "-C", str(dest), "fetch", "--quiet", "origin", pack["sha"]], check=True)
              else:
                  subprocess.run(["git", "clone", "--quiet", pack["url"], str(dest)], check=True)
              subprocess.run(["git", "-C", str(dest), "checkout", "--quiet", pack["sha"]], check=True)
          PY
      - name: Check each pack against its remote HEAD
        id: drift
        working-directory: agent-profiles
        run: |
          python - <<'PY'
          import json, pathlib, subprocess
          config_path = pathlib.Path("profiles.json")
          config = json.loads(config_path.read_text())
          parent = pathlib.Path("..").resolve()
          drift = []
          for short, pack in config["packs"].items():
              head = subprocess.run(
                  ["git", "ls-remote", pack["url"], "HEAD"],
                  capture_output=True, text=True, check=True,
              ).stdout.split()[0]
              status = "current" if head == pack["sha"] else "drift"
              print(f"{pack['repo']}: pinned {pack['sha']} remote {head} ({status})")
              if head != pack["sha"]:
                  drift.append(f"{pack['repo']}: {pack['sha']} -> {head}")
                  pack["sha"] = head
                  dest = parent / pack["repo"]
                  subprocess.run(["git", "-C", str(dest), "fetch", "--quiet", "origin", head], check=True)
                  subprocess.run(["git", "-C", str(dest), "checkout", "--quiet", head], check=True)
          if drift:
              config_path.write_text(json.dumps(config, indent=2) + "\n")
              pathlib.Path("${{ runner.temp }}/drift.txt").write_text("\n".join(drift) + "\n")
              print("drift detected")
          else:
              print("all pins current")
          PY
          if [ -f "${{ runner.temp }}/drift.txt" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            cat "${{ runner.temp }}/drift.txt"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Rebuild bundles from new pins
        if: steps.drift.outputs.found == 'true'
        working-directory: agent-profiles
        run: |
          uv sync --frozen
          uv run python scripts/profiles.py build
          uv run python scripts/profiles.py check-exports
          uv run python scripts/profiles.py routing
      - name: Open pin update PR
        if: steps.drift.outputs.found == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          path: agent-profiles
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/pin-updates
          delete-branch: true
          title: "chore: update pinned skill packs"
          body: "Remote HEAD moved for one or more source packs. This PR bumps profiles.json to the new HEADs and rebuilds plugins/. Review the source diffs before merging."
          commit-message: "chore: update pinned skill packs"
          add-paths: |
            profiles.json
            plugins
